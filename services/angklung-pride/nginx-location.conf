    location = /undangan/angklung-pride {
        return 308 https://lemburudjoparahyangan.com/undangan/angklung-pride/$is_args$args;
    }

    location ^~ /undangan/angklung-pride/ {
        if ($host = www.lemburudjoparahyangan.com) {
            return 308 https://lemburudjoparahyangan.com$request_uri;
        }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
